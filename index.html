<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D High-Voltage Electrical Explosion Simulator</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05050a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #ui-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            z-index: 10;
            backdrop-filter: blur(5px);
            width: 90%;
            max-width: 500px;
        }
        h1 {
            margin: 0;
            font-size: 18px;
            color: #ef4444;
            text-align: center;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
        }
        input[type=range] {
            flex: 1;
            accent-color: #ef4444;
            cursor: pointer;
            height: 8px;
        }
        #volt-val {
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
            min-width: 70px;
            text-align: right;
        }
        .btn-row {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 8px 15px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; }
        #status-text {
            font-size: 13px;
            color: #cbd5e1;
            font-weight: bold;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <h1>⚡ 3D High-Voltage Appliance Surge Simulator</h1>
        <div class="control-group">
            <label>Voltage:</label>
            <input type="range" id="voltageSlider" min="100" max="500" value="220" oninput="onVoltageChange(this.value)">
            <div id="volt-val">220V</div>
        </div>
        <div class="btn-row">
            <button class="btn-danger" onclick="triggerSurge()">⚡ 450V Surge Spike</button>
            <button class="btn-primary" onclick="resetAppliance()">🔄 Reset 3D Model</button>
        </div>
        <div id="status-text">সিস্টেম স্বাভাবিক চলছে (Normal 220V AC)</div>
    </div>

    <div id="canvas-container"></div>

    <!-- Three.js Library CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, appliance, particles = [];
        let isDestroyed = false;
        let targetColor = 0x38bdf8;

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x05050a, 0.03);

            // Camera setup
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3, 7);
            camera.lookAt(0, 0, 0);

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 1.5, 50);
            pointLight.position.set(5, 5, 5);
            scene.add(pointLight);

            // Create 3D Appliance (Mock Smart Device/Box)
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x3b82f6, 
                roughness: 0.3, 
                metalness: 0.8 
            });
            appliance = new THREE.Mesh(geometry, material);
            scene.add(appliance);

            // Add floor grid
            const gridHelper = new THREE.GridHelper(20, 20, 0xef4444, 0x334155);
            gridHelper.position.y = -2;
            scene.add(gridHelper);

            // Window resize listener
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function onVoltageChange(val) {
            document.getElementById('volt-val').innerText = val + "V";
            const statusText = document.getElementById('status-text');

            if (val > 350) {
                statusText.innerText = "💥 এক্সপ্লোশন! অতিরিক্ত ভোল্টেজে ডিভাইস ফেটে গেছে!";
                statusText.style.color = "#ef4444";
                if (!isDestroyed) explodeAppliance();
            } else if (val > 260) {
                statusText.innerText = "⚠️ ওভারভোল্টেজ! স্পার্ক ও গরম হতে শুরু করেছে...";
                statusText.style.color = "#f59e0b";
                if (isDestroyed) resetAppliance(false);
            } else {
                statusText.innerText = "সিস্টেম স্বাভাবিক চলছে (Normal 220V AC)";
                statusText.style.color = "#38bdf8";
                if (isDestroyed) resetAppliance(false);
            }
        }

        function explodeAppliance() {
            isDestroyed = true;
            scene.remove(appliance);

            // Create explosion debris (particles)
            for (let i = 0; i < 50; i++) {
                const pGeo = new THREE.BoxGeometry(0.2, 0.2, 0.2);
                const pMat = new THREE.MeshStandardMaterial({ 
                    color: Math.random() > 0.5 ? 0xef4444 : 0xf59e0b,
                    emissive: 0xff0000 
                });
                const piece = new THREE.Mesh(pGeo, pMat);
                
                piece.position.set(
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 0.5,
                    (Math.random() - 0.5) * 0.5
                );

                piece.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.15,
                    Math.random() * 0.15 + 0.05,
                    (Math.random() - 0.5) * 0.15
                );

                scene.add(piece);
                particles.push(piece);
            }
        }

        function resetAppliance(resetSlider = true) {
            if (resetSlider) {
                document.getElementById('voltageSlider').value = 220;
                document.getElementById('volt-val').innerText = "220V";
                document.getElementById('status-text').innerText = "সিস্টেম স্বাভাবিক চলছে (Normal 220V AC)";
                document.getElementById('status-text').style.color = "#38bdf8";
            }

            // Clear old particles
            particles.forEach(p => scene.remove(p));
            particles = [];

            // Re-add appliance
            if (!scene.children.includes(appliance)) {
                scene.add(appliance);
            }
            isDestroyed = false;
        }

        function triggerSurge() {
            document.getElementById('voltageSlider').value = 460;
            onVoltageChange(460);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (!isDestroyed && appliance) {
                appliance.rotation.x += 0.005;
                appliance.rotation.y += 0.01;
            } else {
                // Animate flying debris from explosion
                particles.forEach(p => {
                    p.position.add(p.velocity);
                    p.velocity.y -= 0.004; // Gravity pull
                    p.rotation.x += 0.05;
                    p.rotation.y += 0.05;
                });
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
